<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OCG™ on the stranding line · Metalube®</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg0:#f6f6f5; --bg1:#e9e9e7; --bg2:#d8d8d5;
  --text:#1f1f1f; --body:#474747; --muted:#6a6a6a;
  --panel:rgba(255,255,255,.82); --panel-solid:#ffffff;
  --hair:rgba(0,0,0,.10); --hair-strong:rgba(0,0,0,.18);
  --gold:#a8730f; --gold-ui:#E0A93E;
  --chip:#1a6fb5; --chip-ink-od:#ffc93a; --chip-ink-id:#ffffff;
  --btn:rgba(0,0,0,.05); --btn-hover:rgba(0,0,0,.09);
  --floor:#b4b4ae; --pad:#a6a6a0; --grid:#9a9a94; --fog:#d2d2cd; --lane:#6c6c66;
  --logo-tile:#262626;
  --shadow:0 10px 30px rgba(0,0,0,.10);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg0:#313131; --bg1:#262626; --bg2:#1b1b1b;
    --text:#ffffff; --body:#b6b6b6; --muted:#9a9a9a;
    --panel:rgba(30,30,30,.78); --panel-solid:#262626;
    --hair:rgba(255,255,255,.09); --hair-strong:rgba(255,255,255,.18);
    --gold:#E0A93E; --gold-ui:#E0A93E;
    --btn:rgba(255,255,255,.06); --btn-hover:rgba(255,255,255,.11);
    --floor:#2b2b2b; --pad:#333333; --grid:#3a3a3a; --fog:#1f1f1f; --lane:#4a4a4a;
    --logo-tile:transparent;
    --shadow:none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg0:#313131; --bg1:#262626; --bg2:#1b1b1b;
  --text:#ffffff; --body:#b6b6b6; --muted:#9a9a9a;
  --panel:rgba(30,30,30,.78); --panel-solid:#262626;
  --hair:rgba(255,255,255,.09); --hair-strong:rgba(255,255,255,.18);
  --gold:#E0A93E; --gold-ui:#E0A93E;
  --btn:rgba(255,255,255,.06); --btn-hover:rgba(255,255,255,.11);
  --floor:#2b2b2b; --pad:#333333; --grid:#3a3a3a; --fog:#1f1f1f; --lane:#4a4a4a;
  --logo-tile:transparent;
  --shadow:none;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;
  background:var(--bg1);
  background-image:radial-gradient(130% 130% at 50% 0%, var(--bg0) 0%, var(--bg1) 55%, var(--bg2) 100%);
  color:var(--text);
  font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.poppins{font-family:Poppins,"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;z-index:2}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-ui);outline-offset:2px}

/* ---------- header ---------- */
.brand{
  position:absolute;top:20px;left:20px;z-index:5;
  display:flex;gap:16px;align-items:center;
  max-width:min(560px,calc(100% - 40px));
  pointer-events:none;
}
.logo-tile{background:var(--logo-tile);border-radius:14px;padding:10px 12px;flex:none;pointer-events:auto}
.logo-tile img{display:block;height:44px;width:auto}
.brand h1{margin:0;font-size:22px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.brand p{margin:4px 0 0;font-size:13.5px;line-height:1.45;color:var(--body);max-width:44ch}

/* ---------- glass cards ---------- */
.card{
  background:var(--panel);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid var(--hair);border-radius:22px;box-shadow:var(--shadow);
}

/* ---------- step list ---------- */
.steps{
  position:absolute;left:20px;top:112px;bottom:96px;z-index:4;width:236px;
  padding:14px 10px 14px 14px;display:flex;flex-direction:column;
}
.steps h2{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px 6px;letter-spacing:.02em}
.steps ol{list-style:none;margin:0;padding:0 4px 0 0;overflow-y:auto;flex:1;scrollbar-width:thin}
.steps li+li{margin-top:2px}
.step{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  padding:7px 8px;border-radius:12px;border:0;background:transparent;cursor:pointer;
  font-size:13.5px;line-height:1.25;color:var(--body);
}
.step:hover{background:var(--btn)}
.step[aria-current="true"]{background:var(--btn-hover);color:var(--text)}
.step .n{
  flex:none;width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;font:600 11px/1 Poppins,system-ui,sans-serif;
  border:1px solid var(--hair-strong);color:var(--muted);
}
.step.lub .n{background:var(--chip);border-color:var(--chip);color:#fff}
.step .name{flex:1}
.step .cnt{font:600 11px/1 Poppins,system-ui,sans-serif;color:var(--gold)}

/* ---------- detail panel ---------- */
.panel{
  position:absolute;right:20px;top:20px;bottom:96px;z-index:4;width:360px;
  display:flex;flex-direction:column;overflow:hidden;
}
.panel-scroll{overflow-y:auto;padding:22px 22px 24px;flex:1;scrollbar-width:thin}
.eyebrow{font-size:12px;color:var(--muted);margin:0 0 4px}
.panel h2{margin:0;font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.panel .lede{margin:10px 0 0;font-size:14px;line-height:1.55;color:var(--body)}
.panel h3{font-size:13px;font-weight:600;margin:22px 0 10px;color:var(--text)}
.xsec{display:flex;align-items:center;gap:14px;margin-top:18px;padding:12px 14px;border:1px solid var(--hair);border-radius:16px}
.xsec svg{flex:none}
.xsec p{margin:0;font-size:12.5px;line-height:1.5;color:var(--body)}
.xsec b{color:var(--text);font-weight:600}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.prod{
  border:1px solid var(--hair);border-radius:16px;padding:12px 14px;
  display:grid;gap:6px;cursor:pointer;background:transparent;text-align:left;width:100%;
}
.prod:hover{border-color:var(--hair-strong)}
.prod.hl{border-color:var(--gold-ui)}
.prod .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prod p{margin:0;font-size:13px;line-height:1.5;color:var(--body)}
.prod a{font:600 12.5px/1 Poppins,system-ui,sans-serif;color:var(--gold);text-decoration:none;justify-self:start;padding:4px 0}
.prod a:hover{text-decoration:underline}
.side{font:600 10.5px/1 Poppins,system-ui,sans-serif;padding:4px 7px;border-radius:999px;border:1px solid var(--hair-strong);color:var(--muted);white-space:nowrap}
.none{font-size:13.5px;line-height:1.55;color:var(--body);margin:0;padding:14px;border:1px dashed var(--hair-strong);border-radius:16px}
.range-grp{margin-top:6px}
.range-grp p{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.usedat{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.usedat button{border:1px solid var(--hair-strong);background:var(--btn);border-radius:999px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.usedat button:hover{background:var(--btn-hover)}
.back{border:0;background:none;color:var(--gold);font:600 12.5px/1 Poppins,system-ui,sans-serif;cursor:pointer;padding:4px 0;margin-bottom:12px}
.cta{
  display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;
}
.cta a{
  font:600 13px/1 Poppins,system-ui,sans-serif;text-decoration:none;border-radius:999px;padding:11px 16px;
  border:1px solid var(--hair-strong);color:var(--text);
}
.cta a.primary{background:var(--gold-ui);border-color:var(--gold-ui);color:#1d1d1d}

/* ---------- chips (blue Tubol labels, yellow = OD, white = ID) ---------- */
.chip{
  display:inline-flex;align-items:center;white-space:nowrap;
  background:var(--chip);border-radius:7px;padding:5px 9px;
  font:600 12px/1.1 Poppins,system-ui,sans-serif;letter-spacing:.01em;border:0;cursor:pointer;
  box-shadow:0 1px 0 rgba(0,0,0,.25);
}
.chip.od{color:var(--chip-ink-od)}
.chip.id{color:var(--chip-ink-id)}
.chip sup{font-size:.6em;margin-left:1px}
.chip.hl{outline:2px solid var(--gold-ui);outline-offset:2px}

/* ---------- 3D labels ---------- */
.anchor{width:0;height:0;position:relative}
.st-label{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  pointer-events:auto;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
  background:var(--panel);border:1px solid var(--hair);border-radius:999px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:4px 10px 4px 4px;font:600 12px/1 Poppins,system-ui,sans-serif;color:var(--text);
  transition:opacity .25s;
}
.st-label .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;border:1px solid var(--hair-strong);color:var(--muted)}
.st-label.lub .n{background:var(--chip);border-color:var(--chip);color:#fff}
.st-label.sel{border-color:var(--gold-ui)}
.st-label.hover{border-color:var(--hair-strong)}
.tagstack{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:auto;
  transition:opacity .25s, transform .25s;
}
.tagstack.down{bottom:auto;top:30px}
.tagstack .chip{font-size:11px;padding:4px 7px;border-radius:6px}
.dim{opacity:.28}
.hide-tags .tagstack{opacity:0;pointer-events:none}
.zoomed-out .tagstack .chip{font-size:10px;padding:3px 6px}
.compact .st-label .nm{display:none}
.compact .st-label{padding:3px}
.compact .tagstack{gap:2px}
.compact .tagstack .chip{font-size:8.5px;padding:2px 4px;border-radius:4px}

/* ---------- controls + legend ---------- */
.dock{
  position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:5;
  display:flex;gap:6px;padding:6px;border-radius:999px;
}
.dock button{
  border:0;background:transparent;border-radius:999px;padding:10px 14px;cursor:pointer;
  font:600 13px/1 Poppins,system-ui,sans-serif;color:var(--body);display:flex;align-items:center;gap:7px;white-space:nowrap;
}
.dock button:hover{background:var(--btn);color:var(--text)}
.dock button[aria-pressed="true"]{background:var(--btn-hover);color:var(--text)}
.dock svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.legend{
  position:absolute;left:20px;bottom:20px;z-index:5;padding:10px 14px;border-radius:16px;
  display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--body);
}
.legend span.chip{cursor:default;font-size:11px;padding:4px 7px}
.legend div{display:flex;align-items:center;gap:7px}
.hint{
  position:absolute;left:50%;top:22px;transform:translateX(-50%);z-index:3;
  font-size:12.5px;color:var(--muted);padding:7px 12px;border-radius:999px;pointer-events:none;
  transition:opacity .6s;
}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:10;color:var(--muted);font:600 14px Poppins,system-ui,sans-serif;transition:opacity .6s}

/* ---------- responsive ---------- */
@media (max-width: 1180px){
  .steps{width:210px}
  .panel{width:320px}
  .hint{display:none}
}
@media (max-width: 900px){
  .brand{top:12px;left:12px;gap:10px}
  .logo-tile{padding:7px 9px;border-radius:12px}
  .logo-tile img{height:30px}
  .brand h1{font-size:16px}
  .brand p{display:none}
  .steps{
    left:0;right:0;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:auto;
    padding:0;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;
  }
  .steps h2{display:none}
  .steps ol{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:0 12px 4px;scrollbar-width:none}
  .steps ol::-webkit-scrollbar{display:none}
  .steps li+li{margin-top:0}
  .step{background:var(--panel);border:1px solid var(--hair);white-space:nowrap;padding:6px 10px 6px 6px;border-radius:999px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .step .cnt{display:none}
  .panel{
    left:8px;right:8px;top:auto;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 116px);
    max-height:46%;border-radius:20px;
  }
  .panel.collapsed{display:none}
  .panel-scroll{padding:16px 16px 18px}
  .panel h2{font-size:19px}
  .dock{bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
  .dock button{padding:9px 11px;font-size:12.5px}
  .legend{left:12px;top:calc(env(safe-area-inset-top,0px) + 64px);bottom:auto;gap:10px;padding:6px 10px;font-size:11px;border-radius:12px}
  .legend span.chip{font-size:10px;padding:3px 6px}
  .xsec svg{width:64px;height:64px}
}
@media (max-width: 520px){
  .dock .lbl{display:none}
  .dock button{padding:10px 12px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important}
}

/* ---------- OCG additions ---------- */
.chip.std{color:var(--chip-ink-od)}
.chip.htls{color:var(--chip-ink-id)}
.chip.generic{color:var(--chip-ink-od)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{border:1px solid var(--hair);border-radius:14px;padding:10px 10px 11px}
.stat b{display:block;font:700 18px/1.1 Poppins,system-ui,sans-serif;color:var(--text);letter-spacing:-.01em}
.stat b.sm{font-size:12.5px;line-height:1.25}
.stat span{display:block;margin-top:5px;font-size:11.5px;line-height:1.35;color:var(--muted)}
.grp{margin:16px 0 8px;font-size:12.5px;color:var(--muted)}
.note{margin:0;font-size:13px;line-height:1.55;color:var(--body)}
.note a{color:var(--gold);font-weight:600;text-decoration:none}
.note a:hover{text-decoration:underline}
.prod{cursor:pointer}
.prod .pick{font:600 11px/1 Poppins,system-ui,sans-serif;color:var(--muted)}
.prod.hl .pick{color:var(--gold)}
.xsec .cap{display:block;margin-top:4px}
@media (max-width: 900px){
  .stats{gap:6px}
  .stat{padding:8px}
  .stat b{font-size:15px}
}
.st-label.sel{background:var(--panel-solid)}

</style>
</head>

(function(){
'use strict';

/* =====================================================================
   DATA — products from the OCG™ range page, stages from the OCG™ film
   ===================================================================== */
const RANGE_URL = 'https://metalube.co.uk/product-category/greases-for-overhead-line-conductors-ocg/';
const CONTACT_URL = 'https://metalube.co.uk/contact/';
const FILM_URL = 'https://metalube.co.uk/wp-content/uploads/2025/10/OCG-Video-Final-v2.mp4';
const P = {
  'ocg-750':      {code:'750',      grp:'std',  desc:'Value-engineered protective grease for overhead line conductors.', url:'https://metalube.co.uk/product/ocg-750/'},
  'ocg-1000':     {code:'1000',     grp:'std',  desc:'Protective grease for aluminium and ACSR overhead line conductors.', url:'https://metalube.co.uk/product/ocg-1000/'},
  'ocg-4500':     {code:'4500',     grp:'std',  desc:'Protective grease for aluminium, ACSR and OPGW overhead line conductors.', url:'https://metalube.co.uk/product/ocg-4500/'},
  'ocg-5000':     {code:'5000',     grp:'std',  desc:'High-performance grease for aluminium, ACSR and OPGW overhead line conductors.', url:'https://metalube.co.uk/product/ocg-5000/'},
  'ocg-6000':     {code:'6000',     grp:'htls', desc:'High-temperature, fully synthetic grease for HTLS conductors.', url:'https://metalube.co.uk/product/ocg-6000/'},
  'ocg-htls-210': {code:'HTLS 210', grp:'htls', desc:'Protective grease for HTLS overhead line conductors.', url:'https://metalube.co.uk/product/ocg-htls-210/'},
  'ocg-htls-250': {code:'HTLS 250', grp:'htls', desc:'Protective grease for HTLS overhead line conductors.', url:'https://metalube.co.uk/product/ocg-htls-250/'}
};
const GROUPS = [
  {id:'std',  name:'Aluminium, ACSR and OPGW conductors'},
  {id:'htls', name:'High-temperature low-sag (HTLS) conductors'}
];
const chipHTML = (id, extra='') => `<span class="chip ${P[id].grp} ${extra}" data-prod="${id}" role="button" tabindex="0">OCG<sup>™</sup>&nbsp;${P[id].code}</span>`;

// The line runs left to right along X. Three stranding + greasing units, as in the film.
const STAGES = [
  {id:'core-payoff', name:'Core Pay-off', x:-46, build:'payoff', grease:false,
    about:'The conductor starts as its core. The core wire is paid off a reel at controlled tension and fed into the first grease application unit.',
    xs:{L:0, G:0, add:'core', cap:'The core on its own.'}},
  {id:'grease-1', name:'Grease Application 1', x:-34, build:'applicator', grease:true, drum:[-34, 4.4],
    about:'OCG™ is pumped from the drum into the grease application unit. As the core passes through, grease is applied over it, ready for the first layer of wire.',
    xs:{L:0, G:1, add:'grease', cap:'OCG™ applied over the core.'}},
  {id:'strander-1', name:'Strander 1', x:-21, build:'strander', lay:1, grease:false,
    about:'The greased core passes through the centre of a rotating cage that carries bobbins of wire. As the cage turns, the wires are laid helically over the core, sealing the grease in, and pulled tight through the closing die.',
    xs:{L:1, G:1, add:'layer', cap:'First layer of wire stranded over the greased core.'}},
  {id:'grease-2', name:'Grease Application 2', x:-8, build:'applicator', grease:true, drum:[-8, 4.4],
    about:'The conductor passes through a second grease application unit, and OCG™ is applied over the first layer before the next one goes on.',
    xs:{L:1, G:2, add:'grease', cap:'OCG™ applied over the first layer.'}},
  {id:'strander-2', name:'Strander 2', x:5, build:'strander', lay:-1, grease:false,
    about:'The next layer of wire is stranded on top of the greased conductor, sealing the grease inside it. Each layer is laid in the opposite direction to the one beneath.',
    xs:{L:2, G:2, add:'layer', cap:'Second layer seals the grease inside the conductor.'}},
  {id:'grease-3', name:'Grease Application 3', x:18, build:'applicator', grease:true, drum:[18, 4.4],
    about:'A third grease application unit applies OCG™ over the second layer, before the outer layer goes on.',
    xs:{L:2, G:3, add:'grease', cap:'OCG™ applied over the second layer.'}},
  {id:'strander-3', name:'Strander 3', x:31, build:'strander', lay:1, grease:false,
    about:'The outer layer of wire is stranded over the greased conductor, sealing the grease inside it. No grease is applied over the outer layer, so the finished conductor keeps a clean aluminium surface. Depending on the conductor specification, grease may go on fewer of the inner layers.',
    xs:{L:3, G:3, add:'layer', cap:'Outer layer stranded over the greased conductor, and left bare.'}},
  {id:'take-up', name:'Take-up Drum', x:44, build:'takeup', grease:false,
    about:'Greasing and stranding continue until the take-up drum is filled with conductor, with OCG™ sealed inside it, ready for dispatch.',
    xs:{L:3, G:3, add:null, cap:'Finished conductor: OCG™ on the core and every inner layer, outer surface bare.'}}
];
const byId = Object.fromEntries(STAGES.map((s,i)=>(s.index=i, [s.id,s])));
const GREASE = STAGES.filter(s=>s.grease);

/* =====================================================================
   THEME
   ===================================================================== */
THREE.ColorManagement.legacyMode = false;
const rootStyle = () => getComputedStyle(document.documentElement);
const tok = n => rootStyle().getPropertyValue(n).trim();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

/* =====================================================================
   RENDERER / SCENE
   ===================================================================== */
const stageEl = document.getElementById('stage');
const labelsEl = document.getElementById('labels');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);
stageEl.appendChild(renderer.domElement);

const labelRenderer = new THREE.CSS2DRenderer({element: labelsEl});

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1f1f1f, 120, 260);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 700);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.38;
controls.minDistance = 6;
controls.maxDistance = 200;
controls.target.set(-1, 1.5, 1.5);

const hemi = new THREE.HemisphereLight(0xffffff, 0x404040, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e6, 1.6);
sun.position.set(-24, 60, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-60, right:60, top:24, bottom:-24, near:10, far:160});
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
sun.target.position.set(0,0,1);
scene.add(sun, sun.target);
const rim = new THREE.DirectionalLight(0xcfe3ff, 0.45);
rim.position.set(40, 30, -50);
scene.add(rim);

/* =====================================================================
   MATERIALS
   ===================================================================== */
const std = o => new THREE.MeshStandardMaterial(o);
const MAT = {
  alu:      std({color:0xd3d7db, metalness:1, roughness:.28}),
  core:     std({color:0x8f979f, metalness:1, roughness:.34}),
  steel:    std({color:0xa7adb3, metalness:.9, roughness:.3}),
  chrome:   std({color:0xd6dade, metalness:1, roughness:.16}),
  dark:     std({color:0x3e4247, metalness:.55, roughness:.45}),
  black:    std({color:0x1c1d1f, metalness:.2, roughness:.7}),
  hose:     std({color:0x18191a, metalness:.1, roughness:.55}),
  guard:    std({color:0xE0A93E, metalness:.25, roughness:.5}),
  grease:   new THREE.MeshPhysicalMaterial({color:0x2a170b, metalness:0, roughness:.5, clearcoat:.45, clearcoatRoughness:.35, bumpScale:.035}),
  drum:     std({color:0x1a6fb5, metalness:.45, roughness:.38}),
  drumLid:  std({color:0x9ea4aa, metalness:.85, roughness:.35}),
  label:    std({color:0xf2f2f2, metalness:0, roughness:.6}),
  labelY:   std({color:0xf5a800, metalness:.1, roughness:.5}),
  glass:    std({color:0x9fc4e0, metalness:.1, roughness:.05, transparent:true, opacity:.28, depthWrite:false})
};
(function(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'); x.fillStyle = '#808080'; x.fillRect(0,0,128,128);
  for (let i=0;i<260;i++){ const v = 90 + Math.random()*120|0; x.fillStyle = `rgba(${v},${v},${v},.55)`; x.beginPath(); x.ellipse(Math.random()*128, Math.random()*128, 3+Math.random()*10, 2+Math.random()*5, Math.random()*Math.PI, 0, Math.PI*2); x.fill(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 8);
  MAT.grease.bumpMap = t; MAT.grease.needsUpdate = true;
})();
const paintBase = std({color:0x4b5056, metalness:.35, roughness:.5});

/* =====================================================================
   GEOMETRY HELPERS
   ===================================================================== */
const Y = 2.6;                       // height of the conductor along the line
function add(g, mesh, x=0,y=0,z=0){ mesh.position.set(x,y,z); g.add(mesh); return mesh; }
function box(g, w,h,d, m, x,y,z){ return add(g, new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m), x,y,z); }
function cylY(g, r,h, m, x,y,z, seg=32, r2){ return add(g, new THREE.Mesh(new THREE.CylinderGeometry(r, r2===undefined?r:r2, h, seg), m), x,y,z); }
function cylX(g, r,h, m, x,y,z, seg=32, r2){ const c = cylY(g,r,h,m,x,y,z,seg,r2); c.rotation.z = Math.PI/2; return c; }
function cylZ(g, r,h, m, x,y,z, seg=32){ const c = cylY(g,r,h,m,x,y,z,seg); c.rotation.x = Math.PI/2; return c; }
function torus(g, R, r, m, x,y,z, rx=0, ry=0){ const t = add(g, new THREE.Mesh(new THREE.TorusGeometry(R, r, 12, 48), m), x,y,z); t.rotation.set(rx, ry, 0); return t; }
const _up = new THREE.Vector3(0,1,0);
function rod(g, a, b, r, m, seg=8){
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), m);
  c.position.copy(a).addScaledVector(d, .5);
  c.quaternion.setFromUnitVectors(_up, d.normalize());
  g.add(c); return c;
}
// upright from the base top to a height
function post(g, w, d, top, m, x, z, base=.4){ return box(g, w, top-base, d, m, x, base+(top-base)/2, z); }

const B = {};

B.payoff = (g, paint) => {
  const c = Y - .95;
  box(g, 3.2,.4,3.0, MAT.dark, 0,.2,0);
  post(g, .32,.32, c+.15, paint, 0, -1.1);
  post(g, .32,.32, c+.15, paint, 0,  1.1);
  cylZ(g, .1, 2.6, MAT.steel, 0, c, 0, 16);
  const reel = new THREE.Group(); reel.position.set(0, c, 0); g.add(reel);
  [-.78,.78].forEach(z=>cylZ(reel, 1.35, .1, MAT.steel, 0,0,z, 48));
  cylZ(reel, .9, 1.46, MAT.core, 0,0,0, 40);
  for (let k=0;k<8;k++) torus(reel, .92, .03, MAT.steel, 0,0,-.66+k*.19);
  cylZ(reel, .3, 1.8, MAT.dark, 0,0,0, 24);
  for (let k=0;k<3;k++){ const s = box(reel, 2.4,.12,.06, MAT.steel, 0,0,.84); s.rotation.z = k*Math.PI/3; }
  box(g, .9,.8,.8, MAT.dark, -.9,.8,-1.7);
  return (t,dt)=>{ reel.rotation.z -= dt*1.4; };
};

B.strander = (g, paint, s) => {
  box(g, 8.4,.4,3.4, MAT.dark, 0,.2,0);
  // rear bearing pedestal and hollow shaft
  post(g, .7,1.2, Y+.3, paint, -3.6, 0);
  cylX(g, .38, 1.1, MAT.steel, -3.75, Y, 0, 24);
  // cradles under the cage discs
  [-2.6, 1.4].forEach(x=>{ box(g, .7,.34,1.6, paint, x,.57,0); cylX(g, .14,.8, MAT.steel, x,.74,.5,16); cylX(g, .14,.8, MAT.steel, x,.74,-.5,16); });
  // drive motor
  cylX(g, .5, 1.3, MAT.dark, -2.9,.95,-1.45, 24);
  box(g, .5,.5,.6, paint, -2.1,.65,-1.45);

  // rotating cage
  const cage = new THREE.Group(); cage.position.set(0, Y, 0); g.add(cage);
  [-2.6, 1.4].forEach(x=>cylX(cage, 1.9, .16, MAT.chrome, x,0,0, 56));
  cylX(cage, .3, 4.6, MAT.steel, -.6,0,0, 24);
  for (let i=0;i<10;i++){ const a = i*Math.PI/5; cylX(cage, .05, 4.0, MAT.steel, -.6, Math.cos(a)*1.78, Math.sin(a)*1.78, 8); }
  const N = 6, R = 1.12;
  for (let i=0;i<N;i++){
    const a = i*Math.PI*2/N, y = Math.cos(a)*R, z = Math.sin(a)*R;
    cylX(cage, .33, 3.0, MAT.alu, -.6, y, z, 24);
    cylX(cage, .46, .07, MAT.steel, -2.1, y, z, 24);
    cylX(cage, .46, .07, MAT.steel,  .9, y, z, 24);
    cylX(cage, .1, 3.9, MAT.dark, -.6, y, z, 12);
    // wire leaving the bobbin, through the lay plate, into the closing die
    const p0 = new THREE.Vector3(1.4, y*.98, z*.98);
    const p1 = new THREE.Vector3(2.55, Math.cos(a)*.62, Math.sin(a)*.62);
    const p2 = new THREE.Vector3(3.55, Math.cos(a)*.1, Math.sin(a)*.1);
    rod(cage, new THREE.Vector3(.95, y*1.0, z*1.0).setY(y+.0), p0, .022, MAT.alu, 6);
    rod(cage, p0, p1, .022, MAT.alu, 6);
    rod(cage, p1, p2, .022, MAT.alu, 6);
  }
  // lay plate (turns with the cage)
  const lp = cylX(cage, .82, .1, MAT.steel, 2.55,0,0, 40);
  // closing die (static)
  post(g, .5,1.0, Y-.3, paint, 3.7, 0);
  box(g, .55,.6,.7, MAT.steel, 3.7, Y, 0);
  cylX(g, .34, .45, MAT.chrome, 3.3, Y, 0, 28, .12);
  const dir = s.lay || 1;
  return (t,dt)=>{ cage.rotation.x += dt*2.4*dir; };
};

B.takeup = (g, paint) => {

  post(g, .45,.7, c+.2, paint, 0,  1.55);
  cylZ(g, .16, 3.6, MAT.steel, 0, c, 0, 16);
  const reel = new THREE.Group(); reel.position.set(0, c, 0); g.add(reel);
  const ringGeo = (()=>{ const pts=[[2.25,-.08],[2.7,-.08],[2.7,.08],[2.25,.08],[2.25,-.08]].map(p=>new THREE.Vector2(p[0],p[1])); const g2 = new THREE.LatheGeometry(pts, 72); g2.rotateX(Math.PI/2); return g2; })();

  cylZ(reel, Rw, 2.1, MAT.alu, 0,0,0, 48);
  for (let k=0;k<12;k++) torus(reel, Rw+.02, .085, MAT.alu, 0,0,-.99+k*.18);
  cylZ(reel, .45, 2.5, MAT.dark, 0,0,0, 24);
  for (const z of [1.12,-1.12]) for (let k=0;k<4;k++){ const sp = box(reel, 4.6,.18,.12, MAT.dark, 0,0,z); sp.rotation.z = k*Math.PI/4; }
  // guide sheave
  post(g, .26,.5, Y-.35, paint, -4.2, 0);

  const sheave = torus(g, .32, .07, MAT.chrome, -4.2, Y-.38, 0);
  cylZ(g, .1,.5, MAT.dark, -4.2, Y-.38, 0, 12);
  return (t,dt)=>{ reel.rotation.z -= dt*.55; sheave.rotation.z -= dt*3; };
};

function buildDrum(){
  const g = new THREE.Group();
  const d = new THREE.Group(); g.add(d);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(.44,.44,1.25,32), MAT.drum); body.position.y = .625; d.add(body);
  [.32,.93].forEach(y=>{ const h = new THREE.Mesh(new THREE.TorusGeometry(.445,.028,8,32), MAT.drum); h.rotation.x=Math.PI/2; h.position.y=y; d.add(h); });
  const LOGO_ARC = 1.6, LOGO_AT = .45;   // logo faces the default camera side
  [LOGO_AT, LOGO_AT + Math.PI].forEach(at=>{   // logo on both sides of the drum
    const logo = new THREE.Mesh(new THREE.CylinderGeometry(.452,.452,.72,32,1,true, at-LOGO_ARC/2, LOGO_ARC), drumLogoMat); logo.position.y = .64; d.add(logo);
  });
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(.42,.44,.04,32), MAT.drum); lid.position.y = 1.27; d.add(lid);
  // drum pump
  const pump = new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.42,16), MAT.dark); pump.position.set(0,1.5,0); d.add(pump);
  const pm = new THREE.Mesh(new THREE.BoxGeometry(.3,.22,.3), MAT.steel); pm.position.set(0,1.78,0); d.add(pm);
  const ring = new THREE.Mesh(new THREE.RingGeometry(.1,1,64), ringMat.clone());
  ring.rotation.x = -Math.PI/2; ring.position.y = .03;
  const rw = 1.45; ring.scale.set(rw, rw, 1); ring.userData.base = rw;
  g.add(ring); pulseRings.push(ring);
  return g;
}

  const el = document.createElement('div'); el.className='anchor';
  const btn = document.createElement('button');

    scene.add(drum);
    s.drums = drum;
    // hose from the drum pump to the applicator inlet, with grease travelling along it
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(s.x, 1.86, s.drum[1]),
      new THREE.Vector3(s.x, Y+1.9, s.drum[1]-.6),
      new THREE.Vector3(s.x, Y+2.15, 1.4),
      new THREE.Vector3(s.x, Y+1.48, 0)
    ]);
    const hose = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, .07, 10, false), MAT.hose);
    hose.castShadow = true; scene.add(hose);
    const blobs = [];
    for (let k=0;k<5;k++){ const b = new THREE.Mesh(new THREE.SphereGeometry(.095,14,10), MAT.grease); scene.add(b); blobs.push({b, u:k/5}); }
    hoses.push({curve, blobs});

    const tagY = 2.5;
    const lg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(s.drum[0]+.0,2.0,s.drum[1]+.0), new THREE.Vector3(s.drum[0],tagY,s.drum[1])]);
    scene.add(new THREE.Line(lg, leaderMat));
    const tel = document.createElement('div'); tel.className='anchor';
    const stack = document.createElement('div'); stack.className = 'tagstack';
    tel.appendChild(stack);
    const tobj = new THREE.CSS2DObject(tel);
    tobj.position.set(s.drum[0], tagY, s.drum[1]);
    scene.add(tobj);
    s.tagEl = stack;

    const dbb = new THREE.Box3().setFromObject(drum);
    const dsz = dbb.getSize(new THREE.Vector3()), dc = dbb.getCenter(new THREE.Vector3());
    const dh = new THREE.Mesh(new THREE.BoxGeometry(dsz.x+.4,dsz.y+.4,dsz.z+.4), hit.material);
    dh.position.copy(dc); dh.userData.stage = s.id; scene.add(dh); hitTargets.push(dh);
  }
});

/* =====================================================================
   THE CONDUCTOR — grows a layer at each strander, picks up grease at each applicator
   ===================================================================== */
function strandTexture(flip){
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#d9dde1'; x.fillRect(0,0,64,64);
  x.save(); if (flip){ x.translate(64,0); x.scale(-1,1); }
  for (let k=-2;k<4;k++){
    const o = k*32;
    x.fillStyle = '#8b9299'; x.beginPath(); x.moveTo(o,0); x.lineTo(o+6,0); x.lineTo(o+6+64,64); x.lineTo(o+64,64); x.closePath(); x.fill();
    x.fillStyle = '#f4f6f8'; x.beginPath(); x.moveTo(o+12,0); x.lineTo(o+18,0); x.lineTo(o+18+64,64); x.lineTo(o+12+64,64); x.closePath(); x.fill();
  }
  x.restore();
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  return t;
}
const conductorTex = [];
function conductorSeg(x0, x1, r, kind, flip){
  const len = x1 - x0;
  let m;
  if (kind === 'core') m = MAT.core;
  else if (kind === 'grease') m = MAT.grease;
  else {
    const t = strandTexture(flip);
    t.repeat.set(6, Math.max(1, len/(r*3.2)));
    conductorTex.push({t, k: 1/(r*3.2)});
    m = std({color:0xffffff, map:t, metalness:.85, roughness:.3});
  }
  const c = cylX(scene, r, len, m, (x0+x1)/2, Y, 0, 28);
  c.castShadow = true;
  // the texture runs along the cylinder's own Y; rotate so stripes travel the right way
  return c;
}
const sx = id => byId[id].x;
const DIE = 3.75, APP = -1.0;
conductorSeg(sx('core-payoff'),       sx('grease-1')+APP,   .07, 'core');
conductorSeg(sx('grease-1')+APP,      sx('strander-1')+DIE, .1,  'grease');
conductorSeg(sx('strander-1')+DIE,    sx('grease-2')+APP,   .14, 'strand', false);
conductorSeg(sx('grease-2')+APP,      sx('strander-2')+DIE, .165,'grease');
conductorSeg(sx('strander-2')+DIE,    sx('grease-3')+APP,   .21, 'strand', true);
conductorSeg(sx('grease-3')+APP,      sx('strander-3')+DIE, .235,'grease');
const guideX = sx('take-up') - 4.2;
conductorSeg(sx('strander-3')+DIE,    guideX, .28, 'strand', false);
// last run: over the guide sheave and up onto the drum, tangent to the wound conductor
(function(){
  const C = new THREE.Vector2(sx('take-up'), 3.3), Pp = new THREE.Vector2(guideX, Y), r = 1.6;
  const d = C.distanceTo(Pp), phi = Math.atan2(Pp.y-C.y, Pp.x-C.x), a = Math.acos(r/d);
  const th = [phi+a, phi-a].sort((u,v)=>Math.sin(v)-Math.sin(u))[0];
  const T = new THREE.Vector3(C.x + r*Math.cos(th), C.y + r*Math.sin(th), 0);
  const A = new THREE.Vector3(Pp.x, Y, 0), len = A.distanceTo(T);
  const tx = strandTexture(false); tx.repeat.set(6, Math.max(1, len/(.28*3.2)));
  conductorTex.push({t: tx, k: -1/(.28*3.2)});
  const m = rod(scene, A, T, .28, std({color:0xffffff, map:tx, metalness:.85, roughness:.3}), 24); m.castShadow = true;
})();

/* =====================================================================
   FLOW LANE
   ===================================================================== */
function makeDashTexture(){
  const c = document.createElement('canvas'); c.width = 128; c.height = 16;
  const x = c.getContext('2d');
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; return {t, c, x};
}
const dashTextures = [];
function paintDash(d, laneHex){
  const x = d.x; x.fillStyle = laneHex; x.fillRect(0,0,128,16);
  x.fillStyle = '#E0A93E';
  x.beginPath(); x.moveTo(40,0); x.lineTo(78,8); x.lineTo(40,16); x.lineTo(56,8); x.closePath(); x.fill();
  d.t.needsUpdate = true;
}
(function(){
  const pts = [[sx('core-payoff'),0],[sx('take-up'),0]];
  const path = new THREE.CurvePath();
  path.add(new THREE.LineCurve3(new THREE.Vector3(pts[0][0],.09,pts[0][1]), new THREE.Vector3(pts[1][0],.09,pts[1][1])));
  const len = path.getLength();
  const d = makeDashTexture();
  d.t.repeat.set(Math.round(len/1.4), 1);
  dashTextures.push(d);
  const geo = new THREE.TubeGeometry(path, 64, .16, 8, false);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({map:d.t, fog:true}));
  m.scale.y = .35; m.position.y = .03;
  scene.add(m);
})();

const ease = k => k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;

function overviewPose(){
  const a = camera.aspect;
  const narrow = a < 1;
  if (narrow){
    const tgt = new THREE.Vector3(-1, 1.5, 1.5);
    const dir = new THREE.Vector3(-0.5, 0.84, 0.1).normalize();
    return {pos: tgt.clone().addScaledVector(dir, 136), tgt};
  }
  const d = a < 1.5 ? 170 : 146;
  const tgt = new THREE.Vector3(2.5, 1.5, 1.5);
  const dir = new THREE.Vector3(0.48, 0.72, 0.56).normalize();

}
function updateViewOffset(){
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  let ox = 0, oy = 0;
  if (w > 900){
    const left = document.querySelector('.steps').getBoundingClientRect().right + 10;
    const right = w - panel.getBoundingClientRect().left + 10;
    ox = (right - left) / 2;

    oy = (bottom - top) / 2;

  camera.setViewOffset(w, h, ox, oy, w, h);

}
function stagePose(s){
  const box = s.bb.clone();
  if (s.drums) box.expandByObject(s.drums);
  const c = box.getCenter(new THREE.Vector3());
  const sz = box.getSize(new THREE.Vector3());
  const r = Math.max(sz.x, sz.z, sz.y*1.4) * .5 + 2.2;
  const narrow = camera.aspect < 1;
  const dist = r / Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) * (narrow? 2.15 : .95);
  const dir = new THREE.Vector3(.35, .55, .76).normalize();
  const tgt = new THREE.Vector3(c.x, Math.min(2.4, sz.y*.4), c.z);
  return {pos: tgt.clone().addScaledVector(dir, dist), tgt};
}

/* =====================================================================
   CONDUCTOR CROSS-SECTION
   ===================================================================== */
const XS = (()=>{
  const c = 3, rc = 9;               // 7-wire core
  const L = []; let inner = rc;
  [12,18,24].forEach(n=>{ const R = inner/(1-Math.PI/n); const w = Math.PI*R/n; L.push({n, R, w}); inner = R + w; });
  return {c, rc, L};
})();
function xsecSVG(st){
  const cx = 38, cy = 38, out = [];
  const ring = (r, col, sw, dash) => `<circle cx="${cx}" cy="${cy}" r="${r.toFixed(2)}" fill="none" stroke="${col}" stroke-width="${sw}" ${dash?'stroke-dasharray="2.5 2.5"':''}/>`;
  // placeholders for layers still to come
  for (let k=st.L;k<3;k++) out.push(ring(XS.L[k].R + XS.L[k].w, 'var(--hair-strong)', 1, true));
  // grease, outermost first
  // grease surface 0 = over the core, 1 = over the first layer, ...
  const gR = j => (j===0 ? XS.rc : XS.L[j-1].R + XS.L[j-1].w);
  for (let j=st.G-1;j>=0;j--){ out.push(`<circle cx="${cx}" cy="${cy}" r="${(gR(j)+1.5).toFixed(2)}" fill="#6b4224"/>`); }
  // core
  out.push(`<circle cx="${cx}" cy="${cy}" r="${XS.c}" fill="#8f979f" stroke="#5e656b" stroke-width=".6"/>`);
  for (let i=0;i<6;i++){ const a = i*Math.PI/3; out.push(`<circle cx="${(cx+Math.cos(a)*2*XS.c).toFixed(2)}" cy="${(cy+Math.sin(a)*2*XS.c).toFixed(2)}" r="${XS.c}" fill="#8f979f" stroke="#5e656b" stroke-width=".6"/>`); }
  // aluminium layers
  for (let k=0;k<st.L;k++){
    const l = XS.L[k];
    for (let i=0;i<l.n;i++){ const a = i*Math.PI*2/l.n + k*.13; out.push(`<circle cx="${(cx+Math.cos(a)*l.R).toFixed(2)}" cy="${(cy+Math.sin(a)*l.R).toFixed(2)}" r="${(l.w-.25).toFixed(2)}" fill="#d9dde1" stroke="#9aa1a7" stroke-width=".5"/>`); }
  }
  // highlight what this stage adds
  if (st.add){
    let r;
    if (st.add === 'core') r = XS.rc + 1.6;
    else if (st.add === 'layer') { const l = XS.L[st.L-1]; r = l.R + l.w + 1.4; }
    else { r = gR(st.G-1) + 2.6; }
    out.push(ring(r, '#E0A93E', 1.4, false));
  }
  return `<svg width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="Conductor cross-section">${out.join('')}</svg>`;
}

// Picking
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null, hovered = null;
function pick(e){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(hitTargets, false)[0];
  return hit ? hit.object.userData.stage : null;
}
renderer.domElement.addEventListener('pointerdown', e=>{ downAt = {x:e.clientX, y:e.clientY}; flight = null; stopTour(); hideHint(); });
renderer.domElement.addEventListener('pointerup', e=>{
  if (!downAt) return;
  const moved = Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y);
  downAt = null;
  if (moved > 6) return;
  const id = pick(e);
  if (id) select(id);
});
renderer.domElement.addEventListener('pointermove', e=>{
  if (e.pointerType !== 'mouse') return;
  const id = pick(e);
  if (id !== hovered){
    if (hovered) byId[hovered].labelEl.classList.remove('hover');
    hovered = id;
    if (hovered) byId[hovered].labelEl.classList.add('hover');
    renderer.domElement.style.cursor = hovered ? 'pointer' : '';
    STAGES.forEach(s=>{ if (s.id!==current){ s.paint.emissive.set(s.id===hovered?0xE0A93E:0x000000); s.paint.emissiveIntensity = s.id===hovered?.08:0; }});
  }
});

    if (document.activeElement && document.activeElement.classList.contains('step')) return;
    const i = current ? byId[current].index : -1;
    const n = e.key==='ArrowRight' ? Math.min(STAGES.length-1, i+1) : Math.max(0, i-1);
    stopTour(); select(STAGES[n].id);
  }
});

window.addEventListener('hashchange', ()=>{ const h = location.hash.slice(1); if (byId[h] && h!==current) select(h); });

/* =====================================================================
   RESIZE + LOOP
   ===================================================================== */
function resize(){
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  renderer.setSize(w, h, false);
  labelRenderer.setSize(w, h);
  camera.aspect = w/h;
  camera.fov = camera.aspect < 1 ? 50 : 38;
  camera.updateProjectionMatrix();
  updateViewOffset();
}
window.addEventListener('resize', ()=>{ resize(); });

const clock = new THREE.Clock();
let t = 0;
const appEl = document.getElementById('app');
const _p = new THREE.Vector3();
const LINE_SPEED = .9;
function loop(){
  const dt = Math.min(clock.getDelta(), .05);
  const moving = !reduceMotion.matches;
  if (moving) t += dt;

  if (flight){
    const k = Math.min(1, (performance.now() - flight.start) / (flight.dur*1000));
    const e = ease(k);
    camera.position.lerpVectors(flight.p0, flight.p1, e);
    controls.target.lerpVectors(flight.t0, flight.t1, e);
    if (k >= 1) flight = null;
  }
  controls.update();

  if (moving){
    updaters.forEach(u=>u(t, dt));
    dashTextures.forEach(d=>{ d.t.offset.x -= dt*.9; });
    conductorTex.forEach(c=>{ c.t.offset.y += dt*LINE_SPEED*c.k; });
    hoses.forEach(h=>h.blobs.forEach(b=>{ b.u = (b.u + dt*.22) % 1; h.curve.getPointAt(b.u, _p); b.b.position.copy(_p); }));
    pulseRings.forEach((r,i)=>{
      const k = (t*.6 + i*.17) % 1;
      const s = r.userData.base * (0.85 + k*.35);
      r.scale.set(s, s, 1);
      r.material.opacity = .55*(1-k);
    });
  } else {
    hoses.forEach(h=>h.blobs.forEach(b=>{ h.curve.getPointAt(b.u, _p); b.b.position.copy(_p); }));
  }

  const dist = camera.position.distanceTo(controls.target);
  appEl.classList.toggle('zoomed-out', dist > 70);
  appEl.classList.toggle('compact', dist > 70 && window.innerWidth <= 900);

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(loop);
}

/* =====================================================================
   START
   ===================================================================== */
resize();
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

const startPose = overviewPose();
camera.position.copy(startPose.tgt).add(new THREE.Vector3(-40, 130, 60));
controls.target.copy(startPose.tgt);
const h0 = location.hash.slice(1);
if (byId[h0]) { overview(false); select(h0); }
else { overview(false); flyTo(startPose.pos, startPose.tgt, 2.4); }
requestAnimationFrame(loop);
const ld = document.getElementById('loading'); ld.style.opacity = 0; setTimeout(()=>ld.remove(), 700);
})();

</script>
